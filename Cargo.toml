[package]
name = "lowcon"
version = "0.1.0"
edition = "2021"
authors = ["LowCon Team"]
description = "A private, low-context local LLM desktop harness"

[dependencies]
eframe = "0.29"
egui = "0.29"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
rand = "0.8"
